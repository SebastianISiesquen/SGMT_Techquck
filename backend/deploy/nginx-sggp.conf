# /etc/nginx/sites-available/sggp
# Reemplace sggp.techquk.com.pe por su dominio. Certbot añadirá el bloque HTTPS (RNF03).
server {
    listen 80;
    server_name sggp.techquk.com.pe;
    root /var/www/sggp/backend/public;
    index index.php;

    # Fotos, actas y documentos subidos desde la web y la app (debe coincidir con upload_max_filesize de PHP)
    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* { deny all; }

    location ~* \.(css|js|svg|png|jpg|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
